[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-probe"
version = "0.1.0"
description = "Recording reverse proxy for the OpenAI Codex CLI: logs every LLM call and swaps the backend model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Aamir" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_probe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
